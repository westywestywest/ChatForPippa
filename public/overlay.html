<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PippaChat Overlay</title><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent!important;overflow:hidden;height:100%;font-family:Arial,sans-serif;color:white}#log{position:absolute;bottom:0;left:0;width:100%;padding:14px;font-size:22px;display:flex;flex-direction:column;gap:10px}.chat-line{flex-shrink:0;background:rgba(23,19,32,.85);border:1px solid #ffffff18;border-radius:10px;padding:12px 15px;line-height:1.5;overflow-wrap:anywhere;animation:arrive .2s ease-out}.meta{font-size:.72em;margin-right:8px;display:inline}.platform{font-size:.65em;font-weight:700;padding:3px 5px;border-radius:4px;margin-right:7px;background:#7048a9;color:#eee}.chat-line[data-platform=youtube] .platform{background:#a84150}.name{font-weight:700}.message{white-space:pre-wrap}.emote{height:1.55em;max-width:8em;vertical-align:middle;object-fit:contain}.emote.zero-width{margin-left:-1.55em}.sticker{height:100px;max-width:160px;vertical-align:middle}.badge{font-size:.65em;color:#c8b7df;margin-right:5px}.badge-img{font-size:1em;height:1.2em;width:auto;vertical-align:-.25em;margin-right:4px}.amount{display:block;color:#a7e9c0;font-size:.7em;margin-bottom:6px}.minimal .chat-line{background:none;border:0;border-radius:0;padding:3px 0;text-shadow:0 2px 3px #000,1px 0 2px #000}.bubble .chat-line{background:#ece1f5;color:#2c1e39;border:0;border-radius:18px 18px 18px 4px}.bubble .name{color:#694283!important}@keyframes arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.chat-line{animation:none}}
:root{color-scheme:dark}
.chat-gif{display:block;width:auto;height:auto;max-width:min(100%,var(--chat-gif-width,280px));max-height:var(--chat-gif-height,200px);object-fit:contain;margin:8px 0 2px;border-radius:6px}
</style><style id="custom-css"></style></head><body><div id="log" role="log" aria-live="off"></div><script type="module" src="/overlay.js"></script></body></html>
